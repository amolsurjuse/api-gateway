server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: api-gateway

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:2s}
      lettuce:
        pool:
          enabled: true
          max-active: ${SPRING_DATA_REDIS_LETTUCE_POOL_MAX_ACTIVE:8}
          max-idle: ${SPRING_DATA_REDIS_LETTUCE_POOL_MAX_IDLE:8}
          min-idle: ${SPRING_DATA_REDIS_LETTUCE_POOL_MIN_IDLE:2}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.electrahub.gateway: ${LOGGING_LEVEL_COM_ELECTRAHUB_GATEWAY:INFO}
    org.springframework: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${API_GATEWAY_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

app:
  security:
    jwt:
      issuer: ${APP_SECURITY_JWT_ISSUER:auth-service}
      secret: ${APP_SECURITY_JWT_SECRET:CHANGE_ME_TO_A_LONG_RANDOM_64+_CHAR_SECRET_CHANGE_ME}
  http-logging:
    enabled: ${APP_HTTP_LOGGING_ENABLED:true}
    include-headers: ${APP_HTTP_LOGGING_INCLUDE_HEADERS:true}
    include-bodies: ${APP_HTTP_LOGGING_INCLUDE_BODIES:true}
    full-request-response: ${APP_HTTP_LOGGING_FULL_REQUEST_RESPONSE:true}
    max-body-length: ${APP_HTTP_LOGGING_MAX_BODY_LENGTH:4096}
  cors:
    allowed-origin-patterns:
      - "http://localhost:*"
      - "http://127.0.0.1:*"
      - "http://localhost:4200"
      - "http://localhost:4201"
      - "http://localhost:4211"
      - "http://localhost:8080"
      - "http://driver-portal-dev.electrahub.com:8080"
      - "https://driver-portal-dev.electrahub.com"
      - "https://driver-portal-dev.electrahub.com:8443"
      - "https://driver-portal-*.electrahub.com"
      - "https://driver-portal-*.electrahub.com:*"
      - "https://dev.electrahub.com"
      - "https://dev.electrahub.com:8443"
      - "https://dev.electrahub.net"
      - "https://electrahub.net"
      - "https://www.electrahub.net"
      - "https://api-dev.electrahub.net"
      - "https://driver-dev.electrahub.net"
      - "https://driver-portal-dev.electrahub.net"
      - "https://admin-dev.electrahub.net"
      - "https://admin-portal-dev.electrahub.net"
      - "https://simulator-dev.electrahub.net"
      - "https://ocpp-simulator-dev.electrahub.net"
      - "https://argocd-dev.electrahub.net"
  rbac:
    transport: ${APP_RBAC_TRANSPORT:grpc}
    role-hierarchy: |
      ROLE_SYSTEM_ADMIN > ROLE_USER
    default-decision: DENY
    internal-api-key: ${APP_RBAC_INTERNAL_API_KEY:dev-rbac-internal-key}
    remote-policy:
      enabled: ${APP_RBAC_REMOTE_POLICY_ENABLED:true}
      source-url: ${APP_RBAC_REMOTE_POLICY_SOURCE_URL:http://user-service:8082/api/internal/rbac/policy}
      refresh-interval: ${APP_RBAC_REMOTE_POLICY_REFRESH_INTERVAL:30s}
    rules:
      - name: cors-preflight
        methods: [ "OPTIONS" ]
        path-pattern: "/**"
        effect: ALLOW
        allow-anonymous: true
      - name: actuator-health
        methods: [ "GET" ]
        path-pattern: "/actuator/health/**"
        effect: ALLOW
        allow-anonymous: true
      - name: openapi-docs
        methods: [ "GET" ]
        path-pattern: "/v3/api-docs/**"
        effect: ALLOW
        allow-anonymous: true
      - name: swagger-ui
        methods: [ "GET" ]
        path-pattern: "/swagger-ui/**"
        effect: ALLOW
        allow-anonymous: true
      - name: swagger-ui-index
        methods: [ "GET" ]
        path-pattern: "/swagger-ui.html"
        effect: ALLOW
        allow-anonymous: true
      - name: auth-login
        methods: [ "POST" ]
        path-pattern: "/auth/api/auth/login"
        effect: ALLOW
        allow-anonymous: true
      - name: auth-register
        methods: [ "POST" ]
        path-pattern: "/auth/api/auth/register"
        effect: ALLOW
        allow-anonymous: true
      - name: auth-refresh
        methods: [ "POST" ]
        path-pattern: "/auth/api/auth/refresh"
        effect: ALLOW
        allow-anonymous: true
      - name: auth-countries
        methods: [ "GET" ]
        path-pattern: "/auth/api/countries/**"
        effect: ALLOW
        allow-anonymous: true
      - name: terms-current-public
        methods: [ "GET" ]
        path-pattern: "/terms/api/v1/terms/current"
        effect: ALLOW
        allow-anonymous: true
      - name: notification-contact-public
        methods: [ "POST" ]
        path-pattern: "/notifications/api/v1/public/contact-inquiries"
        effect: ALLOW
        allow-anonymous: true
      - name: notification-push-devices
        methods: [ "POST", "DELETE" ]
        path-pattern: "/notifications/api/v1/push/devices/**"
        effect: ALLOW
        required-roles: [ "USER" ]
      - name: notification-push-devices-root
        methods: [ "POST" ]
        path-pattern: "/notifications/api/v1/push/devices"
        effect: ALLOW
        required-roles: [ "USER" ]
      - name: notification-push-devices-legacy
        methods: [ "POST", "DELETE" ]
        path-pattern: "/notification/api/v1/push/devices/**"
        effect: ALLOW
        required-roles: [ "USER" ]
      - name: notification-push-devices-legacy-root
        methods: [ "POST" ]
        path-pattern: "/notification/api/v1/push/devices"
        effect: ALLOW
        required-roles: [ "USER" ]
      - name: notification-driver-inbox
        methods: [ "GET", "PATCH" ]
        path-pattern: "/notifications/api/v1/me/inbox/**"
        effect: ALLOW
        required-roles: [ "USER" ]
      - name: notification-driver-inbox-root
        methods: [ "GET" ]
        path-pattern: "/notifications/api/v1/me/inbox"
        effect: ALLOW
        required-roles: [ "USER" ]
      - name: notification-admin-inbox
        methods: [ "GET", "PATCH" ]
        path-pattern: "/notifications/api/v1/inbox/**"
        effect: ALLOW
        required-roles: [ "SYSTEM_ADMIN", "ADMIN_READ_ONLY" ]
      - name: notification-admin-inbox-root
        methods: [ "GET" ]
        path-pattern: "/notifications/api/v1/inbox"
        effect: ALLOW
        required-roles: [ "SYSTEM_ADMIN", "ADMIN_READ_ONLY" ]
      - name: ai-support-service
        methods: [ "*" ]
        path-pattern: "/ai/**"
        effect: ALLOW
        required-roles: [ "USER" ]
      - name: terms-authenticated
        methods: [ "GET", "POST" ]
        path-pattern: "/terms/api/v1/terms/**"
        effect: ALLOW
        required-roles: [ "USER" ]
      - name: readonly-admin-user-write-deny
        methods: [ "POST", "PUT", "PATCH", "DELETE" ]
        path-pattern: "/user/api/v1/admin/**"
        effect: DENY
        required-roles: [ "ADMIN_READ_ONLY" ]
      - name: readonly-admin-admin-users-root-deny
        methods: [ "*" ]
        path-pattern: "/user/api/v1/admin/users"
        effect: DENY
        required-roles: [ "ADMIN_READ_ONLY" ]
      - name: readonly-admin-admin-users-deny
        methods: [ "*" ]
        path-pattern: "/user/api/v1/admin/users/**"
        effect: DENY
        required-roles: [ "ADMIN_READ_ONLY" ]
      - name: readonly-admin-users-root-deny
        methods: [ "*" ]
        path-pattern: "/user/api/v1/users"
        effect: DENY
        required-roles: [ "ADMIN_READ_ONLY" ]
      - name: readonly-admin-users-deny
        methods: [ "*" ]
        path-pattern: "/user/api/v1/users/**"
        effect: DENY
        required-roles: [ "ADMIN_READ_ONLY" ]
      - name: readonly-admin-terms-write-deny
        methods: [ "POST", "PUT", "PATCH", "DELETE" ]
        path-pattern: "/admin/api/v1/terms/**"
        effect: DENY
        required-roles: [ "ADMIN_READ_ONLY" ]
      - name: readonly-admin-terms-root-write-deny
        methods: [ "POST", "PUT", "PATCH", "DELETE" ]
        path-pattern: "/admin/api/v1/terms"
        effect: DENY
        required-roles: [ "ADMIN_READ_ONLY" ]
      - name: readonly-admin-billing-write-deny
        methods: [ "POST", "PUT", "PATCH", "DELETE" ]
        path-pattern: "/billing/**"
        effect: DENY
        required-roles: [ "ADMIN_READ_ONLY" ]
      - name: readonly-admin-billing-users-root-deny
        methods: [ "*" ]
        path-pattern: "/billing/api/v1/admin/analytics/users"
        effect: DENY
        required-roles: [ "ADMIN_READ_ONLY" ]
      - name: readonly-admin-billing-users-deny
        methods: [ "*" ]
        path-pattern: "/billing/api/v1/admin/analytics/users/**"
        effect: DENY
        required-roles: [ "ADMIN_READ_ONLY" ]
      - name: readonly-admin-billing-reports-root-deny
        methods: [ "*" ]
        path-pattern: "/billing/api/v1/admin/analytics/reports"
        effect: DENY
        required-roles: [ "ADMIN_READ_ONLY" ]
      - name: readonly-admin-billing-reports-deny
        methods: [ "*" ]
        path-pattern: "/billing/api/v1/admin/analytics/reports/**"
        effect: DENY
        required-roles: [ "ADMIN_READ_ONLY" ]
      - name: readonly-admin-charger-write-deny
        methods: [ "POST", "PUT", "PATCH", "DELETE" ]
        path-pattern: "/charger/api/v1/admin/**"
        effect: DENY
        required-roles: [ "ADMIN_READ_ONLY" ]
      - name: readonly-admin-subscription-admin-write-deny
        methods: [ "POST", "PUT", "PATCH", "DELETE" ]
        path-pattern: "/subscription/api/v1/admin/**"
        effect: DENY
        required-roles: [ "ADMIN_READ_ONLY" ]
      - name: readonly-admin-subscription-write-deny
        methods: [ "POST", "PUT", "PATCH", "DELETE" ]
        path-pattern: "/subscription/api/v1/subscriptions/**"
        effect: DENY
        required-roles: [ "ADMIN_READ_ONLY" ]
      - name: readonly-admin-pricing-plans-write-deny
        methods: [ "POST", "PUT", "PATCH", "DELETE" ]
        path-pattern: "/pricing/**"
        effect: DENY
        required-roles: [ "ADMIN_READ_ONLY" ]
      - name: readonly-admin-station-write-deny
        methods: [ "POST", "PUT", "PATCH", "DELETE" ]
        path-pattern: "/station/**"
        effect: DENY
        required-roles: [ "ADMIN_READ_ONLY" ]
      - name: readonly-admin-charger-management-write-deny
        methods: [ "POST", "PUT", "PATCH", "DELETE" ]
        path-pattern: "/charger-management/**"
        effect: DENY
        required-roles: [ "ADMIN_READ_ONLY" ]
      - name: terms-admin
        methods: [ "*" ]
        path-pattern: "/admin/api/v1/terms/**"
        effect: ALLOW
        required-roles: [ "SYSTEM_ADMIN" ]
      - name: terms-admin-root
        methods: [ "GET", "POST" ]
        path-pattern: "/admin/api/v1/terms"
        effect: ALLOW
        required-roles: [ "SYSTEM_ADMIN" ]
      - name: legacy-terms-current
        methods: [ "GET" ]
        path-pattern: "/user/api/v1/terms/current"
        effect: ALLOW
        allow-anonymous: true
      - name: legacy-terms-accept
        methods: [ "POST" ]
        path-pattern: "/user/api/v1/terms/accept"
        effect: ALLOW
        required-roles: [ "USER" ]
      - name: legacy-terms-acceptance-status
        methods: [ "GET" ]
        path-pattern: "/user/api/v1/terms/status"
        effect: ALLOW
        required-roles: [ "USER" ]
      - name: legacy-terms-admin
        methods: [ "*" ]
        path-pattern: "/user/api/v1/admin/terms/**"
        effect: ALLOW
        required-roles: [ "SYSTEM_ADMIN" ]
      - name: user-admin
        methods: [ "*" ]
        path-pattern: "/user/api/v1/admin/**"
        effect: ALLOW
        required-roles: [ "SYSTEM_ADMIN" ]
      - name: auth-user
        methods: [ "*" ]
        path-pattern: "/auth/**"
        effect: ALLOW
        required-roles: [ "USER" ]
      - name: user-service
        methods: [ "*" ]
        path-pattern: "/user/**"
        effect: ALLOW
        required-roles: [ "USER" ]
      - name: subscription-service
        methods: [ "*" ]
        path-pattern: "/subscription/**"
        effect: ALLOW
        required-roles: [ "USER" ]
      - name: payment-service
        methods: [ "*" ]
        path-pattern: "/payment/**"
        effect: ALLOW
        required-roles: [ "USER" ]
      - name: billing-admin-service
        methods: [ "*" ]
        path-pattern: "/billing/api/v1/admin/**"
        effect: ALLOW
        required-roles: [ "SYSTEM_ADMIN" ]
      - name: billing-service
        methods: [ "*" ]
        path-pattern: "/billing/**"
        effect: ALLOW
        required-roles: [ "USER" ]
      - name: charger-management-service
        methods: [ "*" ]
        path-pattern: "/charger-management/**"
        effect: ALLOW
        required-roles: [ "USER" ]
      - name: charger-admin-service
        methods: [ "*" ]
        path-pattern: "/charger/api/v1/admin/**"
        effect: ALLOW
        required-roles: [ "SYSTEM_ADMIN" ]
      - name: charger-admin-chargers-connectors-public
        methods: [ "GET" ]
        path-pattern: "/charger/api/v1/admin/chargers/connectors"
        effect: ALLOW
        allow-anonymous: true
      - name: charger-service
        methods: [ "*" ]
        path-pattern: "/charger/**"
        effect: ALLOW
        required-roles: [ "USER" ]
      - name: charger-graphql
        methods: [ "POST", "GET" ]
        path-pattern: "/charger/graphql"
        effect: ALLOW
        allow-anonymous: true
      - name: pricing-admin
        methods: [ "*" ]
        path-pattern: "/pricing/api/v1/pricing/plans/**"
        effect: ALLOW
        required-roles: [ "SYSTEM_ADMIN" ]
      - name: pricing-search
        methods: [ "POST", "GET" ]
        path-pattern: "/pricing/api/v1/pricing/search/**"
        effect: ALLOW
        required-roles: [ "USER" ]
      - name: pricing-calculate
        methods: [ "POST" ]
        path-pattern: "/pricing/api/v1/pricing/calculate/**"
        effect: ALLOW
        required-roles: [ "USER" ]
      - name: pricing-history
        methods: [ "GET" ]
        path-pattern: "/pricing/api/v1/pricing/history/**"
        effect: ALLOW
        required-roles: [ "SYSTEM_ADMIN" ]
      - name: pricing-signals
        methods: [ "*" ]
        path-pattern: "/pricing/api/v1/pricing/signals/**"
        effect: ALLOW
        required-roles: [ "SYSTEM_ADMIN" ]
      - name: pricing-ocpi
        methods: [ "*" ]
        path-pattern: "/pricing/api/v1/pricing/ocpi/**"
        effect: ALLOW
        required-roles: [ "SYSTEM_ADMIN" ]
      - name: pricing-health
        methods: [ "GET" ]
        path-pattern: "/pricing/api/v1/pricing/health"
        effect: ALLOW
        allow-anonymous: true
      - name: web-socket-connector
        methods: [ "*" ]
        path-pattern: "/ws/**"
        effect: ALLOW
        required-roles: [ "USER" ]
      - name: session-admin-read
        methods: [ "GET" ]
        path-pattern: "/session/api/v1/sessions/admin/**"
        effect: ALLOW
        required-roles: [ "SYSTEM_ADMIN", "ADMIN_READ_ONLY" ]
      - name: session-service
        methods: [ "*" ]
        path-pattern: "/session/**"
        effect: ALLOW
        required-roles: [ "USER" ]
      - name: station-management-service
        methods: [ "*" ]
        path-pattern: "/station/**"
        effect: ALLOW
        required-roles: [ "USER" ]
  redis:
    denylist-prefix: ${APP_REDIS_DENYLIST_PREFIX:deny:jwt:}
    token-version-prefix: ${APP_REDIS_TOKEN_VERSION_PREFIX:tv:}
  grpc:
    forwarders:
      auth:
        enabled: ${APP_GRPC_FORWARDERS_AUTH_ENABLED:true}
      user:
        enabled: ${APP_GRPC_FORWARDERS_USER_ENABLED:true}
      payment:
        enabled: ${APP_GRPC_FORWARDERS_PAYMENT_ENABLED:true}
      subscription:
        enabled: ${APP_GRPC_FORWARDERS_SUBSCRIPTION_ENABLED:true}
      charger:
        enabled: ${APP_GRPC_FORWARDERS_CHARGER_ENABLED:true}
      pricing:
        enabled: ${APP_GRPC_FORWARDERS_PRICING_ENABLED:true}

gateway:
  identity:
    default-tenant: ${GATEWAY_IDENTITY_DEFAULT_TENANT:electrahub}
  http-client:
    connect-timeout: ${GATEWAY_HTTP_CLIENT_CONNECT_TIMEOUT:3s}
    read-timeout: ${GATEWAY_HTTP_CLIENT_READ_TIMEOUT:12s}
    streaming-connect-timeout: ${GATEWAY_HTTP_CLIENT_STREAMING_CONNECT_TIMEOUT:5s}
  routes:
    auth: ${GATEWAY_ROUTES_AUTH:${GATEWAY_ROUTE_AUTH:http://auth-service:8080}}
    user: ${GATEWAY_ROUTES_USER:${GATEWAY_ROUTE_USER:http://user-service:8082}}
    subscription: ${GATEWAY_ROUTES_SUBSCRIPTION:${GATEWAY_ROUTE_SUBSCRIPTION:http://subscription-service:8086}}
    payment: ${GATEWAY_ROUTES_PAYMENT:${GATEWAY_ROUTE_PAYMENT:http://payment-service:8083}}
    billing: ${GATEWAY_ROUTES_BILLING:${GATEWAY_ROUTE_BILLING:http://billing-service:8085}}
    charger-management: ${GATEWAY_ROUTES_CHARGER_MANAGEMENT:${GATEWAY_ROUTE_CHARGER_MANAGEMENT:http://charger-management-service:8086}}
    charger: ${GATEWAY_ROUTES_CHARGER:${GATEWAY_ROUTE_CHARGER:${GATEWAY_ROUTE_CHARGER_MANAGEMENT:http://charger-management-service:8086}}}
    ws-connector: ${GATEWAY_ROUTES_WS_CONNECTOR:${GATEWAY_ROUTE_WS_CONNECTOR:http://web-socket-connector:8091}}
    pricing: ${GATEWAY_ROUTES_PRICING:${GATEWAY_ROUTE_PRICING:http://pricing-service:8092}}
    terms: ${GATEWAY_ROUTES_TERMS:${GATEWAY_ROUTE_TERMS:${GATEWAY_ROUTE_USER:http://user-service:8082}}}
    admin: ${GATEWAY_ROUTES_ADMIN:${GATEWAY_ROUTE_ADMIN:${GATEWAY_ROUTE_USER:http://user-service:8082}}}
    session: ${GATEWAY_ROUTES_SESSION:${GATEWAY_ROUTE_SESSION:http://session-service:8083}}
    station: ${GATEWAY_ROUTES_STATION:${GATEWAY_ROUTE_STATION:http://station-management-service:8081}}
    notification: ${GATEWAY_ROUTES_NOTIFICATION:${GATEWAY_ROUTES_NOTIFICATIONS:${GATEWAY_ROUTE_NOTIFICATIONS:http://notification-service:8085/notifications}}}
    notifications: ${GATEWAY_ROUTES_NOTIFICATIONS:${GATEWAY_ROUTE_NOTIFICATIONS:http://notification-service:8085/notifications}}
    ai: ${GATEWAY_ROUTES_AI:${GATEWAY_ROUTE_AI:http://ai-support-service:8094}}

grpc:
  client:
    auth-service:
      address: ${GRPC_CLIENT_AUTH_SERVICE_ADDRESS:dns:///auth-service:9080}
      negotiation-type: plaintext
    user-service:
      address: ${GRPC_CLIENT_USER_SERVICE_ADDRESS:dns:///user-service:9082}
      negotiation-type: plaintext
    payment-service:
      address: ${GRPC_CLIENT_PAYMENT_SERVICE_ADDRESS:dns:///payment-service:9083}
      negotiation-type: plaintext
    subscription-service:
      address: ${GRPC_CLIENT_SUBSCRIPTION_SERVICE_ADDRESS:dns:///subscription-service:9086}
      negotiation-type: plaintext
    charger-management-service:
      address: ${GRPC_CLIENT_CHARGER_SERVICE_ADDRESS:dns:///charger-management-service:9086}
      negotiation-type: plaintext
    pricing-service:
      address: ${GRPC_CLIENT_PRICING_SERVICE_ADDRESS:dns:///pricing-service:9092}
      negotiation-type: plaintext
