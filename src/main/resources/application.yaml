server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: api-gateway

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:2s}
      lettuce:
        pool:
          enabled: true
          max-active: ${SPRING_DATA_REDIS_LETTUCE_POOL_MAX_ACTIVE:8}
          max-idle: ${SPRING_DATA_REDIS_LETTUCE_POOL_MAX_IDLE:8}
          min-idle: ${SPRING_DATA_REDIS_LETTUCE_POOL_MIN_IDLE:2}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.electrahub.gateway: ${LOGGING_LEVEL_COM_ELECTRAHUB_GATEWAY:INFO}
    org.springframework: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

app:
  security:
    jwt:
      issuer: ${APP_SECURITY_JWT_ISSUER:auth-service}
      secret: ${APP_SECURITY_JWT_SECRET:CHANGE_ME_TO_A_LONG_RANDOM_64+_CHAR_SECRET_CHANGE_ME}
  cors:
    allowed-origin-patterns:
      - "http://localhost:*"
      - "http://127.0.0.1:*"
      - "http://localhost:4200"
      - "http://localhost:4201"
      - "http://localhost:4211"
      - "http://localhost:8080"
      - "http://driver-portal-dev.electrahub.com:8080"
      - "https://driver-portal-dev.electrahub.com"
      - "https://driver-portal-dev.electrahub.com:8443"
      - "https://driver-portal-*.electrahub.com"
      - "https://driver-portal-*.electrahub.com:*"
      - "https://dev.electrahub.com"
      - "https://dev.electrahub.com:8443"
  rbac:
    role-hierarchy: |
      ROLE_SYSTEM_ADMIN > ROLE_USER
    default-decision: DENY
    internal-api-key: ${APP_RBAC_INTERNAL_API_KEY:dev-rbac-internal-key}
    remote-policy:
      enabled: ${APP_RBAC_REMOTE_POLICY_ENABLED:true}
      source-url: ${APP_RBAC_REMOTE_POLICY_SOURCE_URL:http://user-service:8082/api/internal/rbac/policy}
      refresh-interval: ${APP_RBAC_REMOTE_POLICY_REFRESH_INTERVAL:30s}
    rules:
      - name: cors-preflight
        methods: [ "OPTIONS" ]
        path-pattern: "/**"
        effect: ALLOW
        allow-anonymous: true
      - name: actuator-health
        methods: [ "GET" ]
        path-pattern: "/actuator/health/**"
        effect: ALLOW
        allow-anonymous: true
      - name: openapi-docs
        methods: [ "GET" ]
        path-pattern: "/v3/api-docs/**"
        effect: ALLOW
        allow-anonymous: true
      - name: swagger-ui
        methods: [ "GET" ]
        path-pattern: "/swagger-ui/**"
        effect: ALLOW
        allow-anonymous: true
      - name: swagger-ui-index
        methods: [ "GET" ]
        path-pattern: "/swagger-ui.html"
        effect: ALLOW
        allow-anonymous: true
      - name: auth-login
        methods: [ "POST" ]
        path-pattern: "/auth/api/auth/login"
        effect: ALLOW
        allow-anonymous: true
      - name: auth-register
        methods: [ "POST" ]
        path-pattern: "/auth/api/auth/register"
        effect: ALLOW
        allow-anonymous: true
      - name: auth-refresh
        methods: [ "POST" ]
        path-pattern: "/auth/api/auth/refresh"
        effect: ALLOW
        allow-anonymous: true
      - name: auth-countries
        methods: [ "GET" ]
        path-pattern: "/auth/api/countries/**"
        effect: ALLOW
        allow-anonymous: true
      - name: user-admin
        methods: [ "*" ]
        path-pattern: "/user/api/v1/admin/**"
        effect: ALLOW
        required-roles: [ "SYSTEM_ADMIN" ]
      - name: auth-user
        methods: [ "*" ]
        path-pattern: "/auth/**"
        effect: ALLOW
        required-roles: [ "USER" ]
      - name: user-service
        methods: [ "*" ]
        path-pattern: "/user/**"
        effect: ALLOW
        required-roles: [ "USER" ]
      - name: subscription-service
        methods: [ "*" ]
        path-pattern: "/subscription/**"
        effect: ALLOW
        required-roles: [ "USER" ]
      - name: payment-service
        methods: [ "*" ]
        path-pattern: "/payment/**"
        effect: ALLOW
        required-roles: [ "USER" ]
      - name: charger-management-service
        methods: [ "*" ]
        path-pattern: "/charger-management/**"
        effect: ALLOW
        required-roles: [ "USER" ]
      - name: charger-admin-service
        methods: [ "*" ]
        path-pattern: "/charger/api/v1/admin/**"
        effect: ALLOW
        required-roles: [ "SYSTEM_ADMIN" ]
      - name: charger-service
        methods: [ "*" ]
        path-pattern: "/charger/**"
        effect: ALLOW
        required-roles: [ "USER" ]
      - name: web-socket-connector
        methods: [ "*" ]
        path-pattern: "/ws/**"
        effect: ALLOW
        required-roles: [ "USER" ]
  redis:
    denylist-prefix: ${APP_REDIS_DENYLIST_PREFIX:deny:jwt:}
    token-version-prefix: ${APP_REDIS_TOKEN_VERSION_PREFIX:tv:}

gateway:
  routes:
    auth: ${GATEWAY_ROUTE_AUTH:http://auth-service:8080}
    user: ${GATEWAY_ROUTE_USER:http://user-service:8082}
    subscription: ${GATEWAY_ROUTE_SUBSCRIPTION:http://subscription-service:8086}
    payment: ${GATEWAY_ROUTE_PAYMENT:http://payment-service:8083}
    charger-management: ${GATEWAY_ROUTE_CHARGER_MANAGEMENT:http://charger-management-service:8086}
    charger: ${GATEWAY_ROUTE_CHARGER:${GATEWAY_ROUTE_CHARGER_MANAGEMENT:http://charger-management-service:8086}}
    ws-connector: ${GATEWAY_ROUTE_WS_CONNECTOR:http://web-socket-connector:8091}
